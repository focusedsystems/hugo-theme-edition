{{- /* Pagefind-powered search modal. The /pagefind/ bundle is generated by the
       `pagefind` binary after the Hugo build (see scripts/build.sh). PagefindUI
       is lazy-loaded the first time the modal opens. */ -}}
<dialog id="search-modal" class="search-modal" aria-label="Search">
    <div class="search-modal-inner">
        <button class="search-close" data-search-close aria-label="Close search">&times;</button>
        <div id="pagefind-search"></div>
    </div>
</dialog>
